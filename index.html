<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>KOL观点日报</title>
<meta name="description" content="每日汇总美股、加密与大宗商品大V观点"/>
<style>
:root {
  --bg: #0f1115;
  --paper: #171a21;
  --text: #e8eaed;
  --muted: #9aa0a6;
  --border: #2a2f3a;
  --red: #c62828;
  --green: #2e7d32;
  --orange: #ed6c02;
  --card: #1c212b;
  --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 8px 24px rgba(0,0,0,.25);
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f5f7;
    --paper: #ffffff;
    --text: #1a1d23;
    --muted: #5f6368;
    --border: #e3e6eb;
    --card: #ffffff;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.04);
  }
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Noto Sans SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
}
a { color: inherit; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
header.site {
  display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline;
  justify-content: space-between; margin-bottom: 28px;
}
header.site h1 { font-size: 1.35rem; margin: 0; font-weight: 700; letter-spacing: .01em; }
header.site p { margin: 0; color: var(--muted); font-size: .92rem; }
.nav a { color: var(--muted); text-decoration: none; margin-left: 14px; font-size: .9rem; }
.nav a:hover { color: var(--text); }
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  padding: 18px 18px 16px; box-shadow: var(--shadow);
}
.grid { display: grid; gap: 14px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
@media (max-width: 900px) {
  .grid-4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .grid-2 { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .grid-4 { grid-template-columns: 1fr; }
}
h2 { font-size: 1.05rem; margin: 28px 0 12px; }
h3 { font-size: .95rem; margin: 0 0 10px; }
.muted { color: var(--muted); font-size: .88rem; }
.chip {
  display: inline-block; padding: 2px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 700; line-height: 20px; letter-spacing: .02em;
}
.chip-多 { background: var(--red); color: #fff; }
.chip-空 { background: var(--green); color: #fff; }
.chip-中性, .chip-波动 { background: var(--orange); color: #fff; }
.chip-off { background: var(--orange); color: #fff; }
.chip-on { background: var(--red); color: #fff; }
.list { margin: 8px 0 0; padding-left: 1.1rem; }
.list li { margin: 4px 0; }
.levels { width: 100%; border-collapse: collapse; font-size: .9rem; }
.levels td { padding: 6px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
.levels td:first-child { color: var(--muted); width: 42%; }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.links a {
  display: inline-block; padding: 6px 10px; border-radius: 10px;
  border: 1px solid var(--border); text-decoration: none; font-size: .82rem; color: var(--muted);
}
.links a:hover { color: var(--text); border-color: var(--muted); }
.hero { display: grid; grid-template-columns: 1.4fr .9fr; gap: 14px; }
@media (max-width: 800px) { .hero { grid-template-columns: 1fr; } }
.gauge { width: 100%; max-width: 320px; }
.proscons { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 700px) { .proscons { grid-template-columns: 1fr; } }
.pro, .con { border-radius: 16px; border: 1px solid var(--border); padding: 14px 16px; background: var(--card); }
.pro h3 { color: var(--red); }
.con h3 { color: var(--green); }
.bars { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.bar-row { display: grid; grid-template-columns: 88px 1fr 48px; gap: 8px; align-items: center; font-size: .85rem; }
.bar-track { height: 10px; background: var(--border); border-radius: 999px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--red); border-radius: 999px; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
.seg button {
  border: 1px solid var(--border); background: transparent; color: var(--muted);
  border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: .85rem;
}
.seg button.active, .seg button:hover { color: var(--text); border-color: var(--muted); }
.kol { border-top: 1px solid var(--border); padding: 10px 0; }
.kol .cat { color: var(--muted); font-size: .78rem; margin-bottom: 2px; }
.kol .name { font-weight: 650; }
.kol .point { color: var(--muted); font-size: .9rem; margin-top: 2px; }
.report-item {
  display: block; text-decoration: none; padding: 16px 18px; margin-bottom: 12px;
  border-radius: 16px; border: 1px solid var(--border); background: var(--card);
  box-shadow: var(--shadow);
}
.report-item:hover { border-color: var(--muted); }
.report-item .top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.report-item h2 { margin: 0; font-size: 1.05rem; }
.footer { margin-top: 36px; color: var(--muted); font-size: .8rem; }
.callout {
  border-left: 3px solid var(--orange); padding: 10px 12px; margin: 10px 0;
  background: color-mix(in srgb, var(--orange) 8%, transparent); border-radius: 0 10px 10px 0;
}
.quote {
  margin: 12px 0 0; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border);
  color: var(--muted); font-size: .9rem; font-style: italic;
}
.quote cite { display: block; margin-top: 8px; font-style: normal; font-size: .8rem; }
</style>
</head>
